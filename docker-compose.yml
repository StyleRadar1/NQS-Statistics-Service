version: '3.8'

networks:
  styleradar-net:
    driver: bridge

services:
  ms-estadisticas:
    build: .
    container_name: sr-ms-estadisticas
    restart: always
    ports:
      - "8420:8420"
    environment:
      - SERVER_PORT=8420
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres-estadisticas
      - DB_PORT=5432
      - DB_NAME=styleradar_statistics
      - DB_USER=styleradar_user
      - DB_PASSWORD=styleradar_secret
      - RABBITMQ_HOST=rabbitmq-donaciones
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      postgres-estadisticas:
        condition: service_healthy
    networks:
      - styleradar-net

  postgres-estadisticas:
    image: postgres:16-alpine
    container_name: sr-postgres-estadisticas
    restart: always
    environment:
      POSTGRES_DB: styleradar_statistics
      POSTGRES_USER: styleradar_user
      POSTGRES_PASSWORD: styleradar_secret
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styleradar_user -d styleradar_statistics"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - styleradar-net