name: CI/CD Pipeline - ms-estadisticas

on:
  push:
    branches:
      - develop
      - master
      - main
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  build-and-test:
    name: Build, Test, Coverage & Docker Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 1. Clean & Compile
        run: mvn -B clean compile

      - name: 2. Unit & Integration Tests with JaCoCo Report
        run: mvn -B test jacoco:report

      - name: 3. Verify Quality Gate & JaCoCo Coverage (Threshold >= 85%)
        run: mvn -B verify

      - name: 4. Package Application JAR
        run: mvn -B package -DskipTests

      - name: 5. Build Docker Image
        run: docker build --build-arg RABBITMQ_CA_PEM_BASE64="${{ secrets.RABBITMQ_CA_PEM_BASE64 }}" -t sr-ms-estadisticas:latest .

  deploy-qa:
    name: Deploy to QA (develop)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate RabbitMQ CA Secret
        run: |
          if [ -z "${{ secrets.RABBITMQ_CA_PEM_BASE64 }}" ]; then
            echo "Error: Secret RABBITMQ_CA_PEM_BASE64 is required for QA deployment."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name acrstyleradarestadisticas

      - name: Build and Push QA Docker Image
        run: |
          docker build --build-arg RABBITMQ_CA_PEM_BASE64="${{ secrets.RABBITMQ_CA_PEM_BASE64 }}" -t acrstyleradarestadisticas.azurecr.io/sr-ms-estadisticas:qa .
          docker push acrstyleradarestadisticas.azurecr.io/sr-ms-estadisticas:qa

      - name: Restart QA Web App
        run: az webapp restart --name sr-ms-estadisticas-qa --resource-group rg-styleradar-estadisticas-qa

  deploy-prod:
    name: Deploy to PROD (master)
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate RabbitMQ CA Secret
        run: |
          if [ -z "${{ secrets.RABBITMQ_CA_PEM_BASE64 }}" ]; then
            echo "Error: Secret RABBITMQ_CA_PEM_BASE64 is required for PROD deployment."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name acrstyleradarestadisticas

      - name: Build and Push PROD Docker Image
        run: |
          docker build --build-arg RABBITMQ_CA_PEM_BASE64="${{ secrets.RABBITMQ_CA_PEM_BASE64 }}" -t acrstyleradarestadisticas.azurecr.io/sr-ms-estadisticas:prod .
          docker push acrstyleradarestadisticas.azurecr.io/sr-ms-estadisticas:prod

      - name: Restart PROD Web App
        run: az webapp restart --name sr-ms-estadisticas-prod --resource-group rg-styleradar-estadisticas-prod
