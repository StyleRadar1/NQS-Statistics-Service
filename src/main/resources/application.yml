server:
  port: 8420
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-estadisticas

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:styleradar_statistics}
    username: ${DB_USER:styleradar_user}
    password: ${DB_PASSWORD:styleradar_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  packages-to-scan: edu.dosw.styleradar.estadisticas.infrastructure.adapter.in.rest

management:
  endpoints:
    web:
      exposure:
        include: health, info

  # Borrar cuando se dockerice RabbitMQ
  health:
    rabbit:
      enabled: false
