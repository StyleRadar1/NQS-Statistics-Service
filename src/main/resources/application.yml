server:
  port: 8420
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-estadisticas

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:styleradar_statistics}
    username: ${DB_USER:styleradar_user}
    password: ${DB_PASSWORD:styleradar_secret}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      trust-store: ${RABBITMQ_TRUSTSTORE:file:/app/rabbitmq-truststore.jks}
      trust-store-password: ${RABBITMQ_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: ${RABBITMQ_TRUSTSTORE_TYPE:PKCS12}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  packages-to-scan:
    - edu.dosw.styleradar.estadisticas.infrastructure.adapter.in.rest
    - edu.dosw.styleradar.estadisticas.infrastructure.web.controller

management:
  endpoints:
    web:
      exposure:
        include: health, info

  # Borrar cuando se dockerice RabbitMQ
  health:
    rabbit:
      enabled: false
